name: 每日更新数据

on:
  schedule:
    - cron: "7 0 * * *"   # 每天 00:07 UTC（北京时间 08:07）
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建（1 = 是）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取并生成 data/
        env:
          FULL: ${{ github.event.inputs.full || '0' }}
        run: bash pipeline/run.sh
      - name: 提交数据（推送后 Vercel 自动部署）
        run: |
          git config user.name "hl-data-bot"
          git config user.email "hl-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%d) 每日更新"
          git push
